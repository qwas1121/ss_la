<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>LA → 그랜드캐년 → 세도나 → 피닉스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#20263B; --clay:#C1592C; --clay-dark:#9A431E;
  --sand:#F3E9D6; --sand-deep:#E8DABF; --sage:#7C8F72;
  --gold:#E3A23A; --dusk:#3A3557; --card:#FFFDF9;
  --line:rgba(32,38,59,0.12); --radius:18px; --ok:#5C8A5C;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',sans-serif; background:var(--sand); color:var(--ink); min-height:100vh; padding-bottom:78px;}
.hero{background:linear-gradient(160deg,var(--dusk) 0%, #4A3F63 45%, var(--clay-dark) 100%); color:#fff; padding:24px 20px 18px; border-radius:0 0 26px 26px; position:relative; overflow:hidden;}
.hero::after{content:"";position:absolute; right:-40px; top:-40px; width:180px; height:180px; background:radial-gradient(circle, rgba(227,162,58,0.35), transparent 70%);}
.hero-eyebrow{font-size:11px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.75; font-weight:600; margin-bottom:6px;}
.hero-title{font-family:'Fraunces',serif; font-size:23px; font-weight:700; margin:0 0 4px;}
.hero-sub{font-size:12.5px; opacity:0.85; margin:0;}

.view{display:none; padding:0 16px;}
.view.active{display:block;}

/* ---- 일정 뷰 ---- */
.tabs{display:flex; gap:8px; overflow-x:auto; padding:16px 0 4px; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px 14px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;}
.tab .d{display:block; font-size:10px; font-weight:500; opacity:0.55; margin-bottom:1px;}
.tab.active{background:var(--clay); border-color:var(--clay); color:#fff;}
.tab.active .d{opacity:0.85;}
.day-panel{display:none; padding-top:6px;}
.day-panel.active{display:block;}
.day-head{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px;}
.day-head h2{font-family:'Fraunces',serif; font-size:18px; margin:0 0 6px; color:var(--clay-dark);}
.day-head p{font-size:13px; line-height:1.55; margin:0; opacity:0.85;}
.day-budget{display:flex; gap:6px; align-items:center; margin-top:10px; font-size:12px; background:var(--sand-deep); border-radius:10px; padding:6px 10px; width:fit-content;}
.section-label{font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--sage); margin:16px 2px 8px;}
.item{position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start;}
.item.done{opacity:0.45;}
.item.done .item-title{text-decoration:line-through;}
.icon{width:34px; height:34px; border-radius:10px; background:var(--sand-deep); display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 34px;}
.item-body{flex:1; min-width:0;}
.item-time{font-size:11px; font-weight:700; color:var(--clay); margin-bottom:2px;}
.item-title{font-size:14.5px; font-weight:600; margin:0 0 3px; line-height:1.35;}
.item-note{font-size:12.5px; opacity:0.7; line-height:1.5; margin:0;}
.item-tip{font-size:12px; background:#FBF3E3; border-left:3px solid var(--gold); padding:6px 8px; border-radius:6px; margin-top:6px; line-height:1.5;}
.item-actions{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
.btn{font-size:11.5px; font-weight:600; padding:6px 10px; border-radius:20px; border:1px solid var(--line); background:var(--sand); color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:4px; cursor:pointer;}
.btn.map{background:var(--clay); color:#fff; border-color:var(--clay);}
.btn.note{background:#fff;}
.map-frame{display:none; margin-top:10px; border-radius:10px; overflow:hidden; border:1px solid var(--line);}
.map-frame.open{display:block;}
.map-frame iframe{width:100%; height:160px; border:0; display:block;}
.tabs{display:flex; gap:8px; overflow-x:auto; padding:16px 0 8px; scrollbar-width:none; scroll-snap-type:x proximity;}
.tabs::-webkit-scrollbar{display:none;}
.tab{scroll-snap-align:start;}
.swipe-hint{text-align:center; font-size:11px; opacity:0.4; margin:2px 0 10px;}
.note-box{display:none; margin-top:8px;}
.note-box.open{display:block;}
.note-box textarea{width:100%; font-family:inherit; font-size:12.5px; border:1px solid var(--line); border-radius:8px; padding:8px; resize:vertical; min-height:50px; background:#fff;}

.res-card{background:linear-gradient(135deg, var(--sage), #6b7d61); color:#fff; border-radius:14px; padding:12px 14px; margin-bottom:10px;}
.res-card b{display:block; font-size:13.5px; margin-bottom:2px;}
.res-card span{font-size:12px; opacity:0.9; display:block;}
.res-card .paid{display:inline-block; font-size:10px; font-weight:700; background:rgba(255,255,255,0.25); padding:2px 8px; border-radius:20px; margin-top:6px;}

/* ---- 예약 뷰 ---- */
.res-group{margin-bottom:18px;}
.res-group h3{font-family:'Fraunces',serif; font-size:15px; margin:0 0 8px; color:var(--clay-dark);}

/* ---- 쇼핑 뷰 ---- */
.shop-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; display:flex; gap:12px;}
.shop-badge{flex:0 0 52px; width:52px; height:52px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:15px; color:#fff; letter-spacing:-0.5px;}
.shop-card h4{margin:0 0 4px; font-size:14px;}
.shop-card p{margin:0; font-size:12.5px; opacity:0.75; line-height:1.5;}
.shop-card .price{font-size:12px; color:var(--clay); font-weight:700; margin-top:5px;}
.shop-card .price .krw{opacity:0.6; font-weight:500; color:var(--ink);}
.shop-check{display:flex; align-items:flex-start; gap:8px; flex:1; min-width:0;}
.shop-check input{margin-top:3px; flex:0 0 auto;}
.pdf-btn{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:16px 0; text-decoration:none; color:var(--ink);}
.pdf-btn .ic2{width:38px; height:38px; border-radius:10px; background:var(--clay); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; flex:0 0 38px;}
.pdf-btn b{display:block; font-size:13.5px;}
.pdf-btn span{font-size:11.5px; opacity:0.6;}

/* ---- 예산 뷰 ---- */
.budget-total{background:linear-gradient(135deg,var(--dusk),var(--clay-dark)); color:#fff; border-radius:16px; padding:18px; margin:16px 0; text-align:center;}
.budget-total .num{font-family:'Fraunces',serif; font-size:28px; font-weight:700;}
.budget-total .label{font-size:11px; opacity:0.75; text-transform:uppercase; letter-spacing:0.08em;}
.budget-row{display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:8px; font-size:13px;}
.budget-row .l{display:flex; align-items:center; gap:8px;}
.budget-row .paid-dot{width:7px; height:7px; border-radius:50%; background:var(--ok);}
.budget-row b{font-size:13px;}
.budget-note{font-size:11.5px; opacity:0.55; text-align:center; margin-top:10px; line-height:1.6;}

/* ---- 바텀 네비 ---- */
.bottom-nav{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:50;}
.nav-btn{flex:1; text-align:center; background:none; border:none; font-family:inherit; font-size:10.5px; color:#8a8a8a; padding:6px 0; cursor:pointer; font-weight:600;}
.nav-btn .ic{display:block; font-size:19px; margin-bottom:2px;}
.nav-btn.active{color:var(--clay);}

footer{text-align:center; font-size:11px; opacity:0.4; padding:20px 20px 6px;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-eyebrow">2026.09.19 — 09.26 · 8박 · 2인</div>
  <h1 class="hero-title">LA 여행 (최종)</h1>
  <p class="hero-sub">🎬 LA → 🌄 Grand Canyon → 🌵 Sedona → ☀️ Phoenix</p>
</div>

<!-- 일정 -->
<div class="view active" id="view-schedule">

  <p class="swipe-hint">👉 좌우로 스와이프해서 날짜 이동</p>

</div>

<!-- 예약 -->
<div class="view" id="view-reservations">
  <a class="pdf-btn" href="예약내역.pdf" target="_blank" rel="noopener">
    <div class="ic2">📄</div>
    <div><b>예약내역 PDF 열기</b><span>숙소·레스토랑·투어 전체 요약본</span></div>

  <div id="res-paid"></div>

  <div id="res-confirmed"></div>
  <div class="section-label">🕓 아직 정해야 할 것</div>
  <div id="res-pending"></div>
</div>

<!-- 쇼핑 -->
<div class="view" id="view-shopping">
  <div class="section-label" style="margin-top:16px;">🎁 회사·가족 선물</div>
  <div id="shop-gifts"></div>
  <div class="section-label">🛍️ 내가 사고 싶은 것</div>

</div>

<div class="view" id="view-budget">

  </div>
  <div class="section-label">항목별 내역</div>
  <div id="budget-list"></div>
  <!-- <p class="budget-note">💱 환율 1,417원 기준 추정치예요. 정확한 원화는 노션 "환율" 페이지에서 실시간으로 확인하세요.<br>쇼핑(SKIMS, Aritzia 등 개인 구매)은 별도 예산으로 챙기세요.</p> -->
</div>

<div class="bottom-nav">
  <button class="nav-btn active" data-view="view-schedule" onclick="switchView('view-schedule',this)"><span class="ic">🗓️</span>일정</button>
  <button class="nav-btn" data-view="view-reservations" onclick="switchView('view-reservations',this)"><span class="ic">🧾</span>예약</button>

</div>

/* ============ 렌더링 ============ */
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

function loadNote(id){ return localStorage.getItem('note_'+id) || ''; }
function saveNote(id, val){ localStorage.setItem('note_'+id, val); }
function loadDone(id){ return localStorage.getItem('done_'+id) === '1'; }

DATA.forEach((day, i) => {
  const tab = document.createElement('div');
  tab.className = 'tab' + (i===0 ? ' active' : '');
  tab.dataset.key = day.key;
  tab.innerHTML = `<span class="d">${day.date}</span>${day.tab}`;
  tab.onclick = () => selectDay(day.key);
  tabsEl.appendChild(tab);

  const panel = document.createElement('div');
  panel.className = 'day-panel' + (i===0 ? ' active' : '');
  panel.id = 'panel-' + day.key;

  let html = `<div class="day-head"><h2>${day.title}</h2><p>${day.concept}</p><div class="day-budget">💰 ${day.budget}</div></div>`;

  if(day.reservations.length){
    html += `<div class="section-label">확정 예약</div>`;
    day.reservations.forEach(r => {
      html += `<div class="res-card"><b>${r.paid ? '✅' : (r.confirmed ? '📌' : '🕓')} ${r.label}</b><span>${r.detail}</span>${r.amount ? `<span class="paid">${r.amount}</span>`:''}</div>`;
    });
  }

  html += `<div class="section-label">오늘의 일정</div>`;
  day.items.forEach((it, idx) => {
    const id = day.key + '-' + idx;
    const done = loadDone(id) ? ' done' : '';
    html += `<div class="item${done}" id="item-${id}">
      <div class="icon">${it.icon}</div>
      <div class="item-body">
        <div class="item-time">${it.t}</div>
        <p class="item-title">${it.title}</p>
        ${it.note ? `<p class="item-note">${it.note}</p>` : ''}
        ${it.tip ? `<div class="item-tip">💡 ${it.tip}</div>` : ''}
        <div class="item-actions">
          ${it.place ? `<a class="btn map" href="${M(it.place)}" target="_blank" rel="noopener">📍 길찾기</a>` : ''}
          ${it.place ? `<span class="btn note" onclick="toggleMap('${id}')">🗺️ 지도</span>` : ''}
          <span class="btn check" onclick="toggleDone('${id}')">✓ 완료</span>
          <span class="btn note" onclick="toggleNote('${id}')">✏️ 메모</span>
        </div>
        ${it.place ? `<div class="map-frame" id="mapframe-${id}"><iframe src="https://maps.google.com/maps?q=${encodeURIComponent(it.place)}&output=embed" loading="lazy"></iframe></div>` : ''}
        <div class="note-box" id="notebox-${id}">
          <textarea placeholder="여기에 개인 메모 입력 (자동 저장됨)" oninput="saveNote('${id}', this.value)">${loadNote(id)}</textarea>
        </div>
      </div>
    </div>`;
  });

  panel.innerHTML = html;
  panelsEl.appendChild(panel);
});

function selectDay(key){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
  document.querySelectorAll('.day-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
  const activeTab = document.querySelector('.tab.active');
  if(activeTab) activeTab.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  window.scrollTo({top:0, behavior:'smooth'});
}
function toggleMap(id){
  document.getElementById('mapframe-' + id).classList.toggle('open');
}
/* ---- 스와이프로 날짜 이동 ---- */
const DAY_KEYS = DATA.map(d => d.key);
let touchStartX = 0, touchStartY = 0;
const panelsWrap = document.getElementById('panels');
panelsWrap.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, {passive:true});
panelsWrap.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)) return; // 세로 스크롤과 구분
  const activeKey = document.querySelector('.tab.active').dataset.key;
  const idx = DAY_KEYS.indexOf(activeKey);
  if(dx < 0 && idx < DAY_KEYS.length - 1) selectDay(DAY_KEYS[idx + 1]); // 왼쪽으로 스와이프 → 다음날
  if(dx > 0 && idx > 0) selectDay(DAY_KEYS[idx - 1]); // 오른쪽으로 스와이프 → 이전날
}, {passive:true});
function toggleDone(id){
  const el = document.getElementById('item-' + id);
  el.classList.toggle('done');
  localStorage.setItem('done_'+id, el.classList.contains('done') ? '1' : '0');
}
function toggleNote(id){
  document.getElementById('notebox-' + id).classList.toggle('open');
}

  ).join('');
  document.getElementById('res-confirmed').innerHTML = RES_CONFIRMED.map(r =>
    `<div class="res-card" style="background:linear-gradient(135deg,var(--clay),var(--clay-dark));"><b>📌 ${r.label}</b><span>${r.when}</span><span>${r.detail}</span></div>`
  ).join('');
  document.getElementById('res-pending').innerHTML = RES_PENDING.map(r =>
    `<div class="shop-card"><h4>🕓 ${r.label}</h4><p>${r.when}</p><p>${r.detail}</p></div>`
  ).join('');
}

/* ---- 쇼핑 뷰 렌더 ---- */
function shopCard(s, id, checked){
  return `<div class="shop-card">
    <div class="shop-badge" style="background:${s.color}">${s.init}</div>
    <label class="shop-check"><input type="checkbox" ${checked} onchange="localStorage.setItem('shop_${id}', this.checked?'1':'0')">
      <span><h4>${s.name}</h4><p>${s.note}</p>
      <p class="price">${s.usdEach} <span class="krw">(총 ${krw(s.usd)})</span></p>
      <p style="font-size:11.5px; opacity:0.55; margin-top:2px;">${s.where}</p></span>
    </label></div>`;
}
function renderShop(){
  document.getElementById('shop-gifts').innerHTML = SHOP_GIFTS.map((s,i) => {
    const id = 'gift-'+i;
    const checked = localStorage.getItem('shop_'+id) === '1' ? 'checked' : '';
    return shopCard(s, id, checked);
  }).join('');
  document.getElementById('shop-wish').innerHTML = SHOP_WISH.map((s,i) => {
    const id = 'wish-'+i;
    const checked = localStorage.getItem('shop_'+id) === '1' ? 'checked' : '';
    return shopCard(s, id, checked);
  }).join('');
}

/* ---- 예산 뷰 렌더 ---- */
function renderBudget(){
  document.getElementById('budget-list').innerHTML = BUDGET.map(b =>
    `<div class="budget-row"><div class="l">${b.paid ? '<span class="paid-dot"></span>' : ''}${b.label}</div><b>${b.amount}</b></div>`
  ).join('');
}

renderRes(); renderShop(); renderBudget();

function switchView(id, btn){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  window.scrollTo({top:0});
}
</script>
